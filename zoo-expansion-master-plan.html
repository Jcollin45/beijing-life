  let selectedId = &#x27;SITE&#x27;;

  function el(name, attrs = {}, parent = svg) {
    const node = document.createElementNS(ns, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
    parent.appendChild(node);
    return node;
  }

  function featureList() {
    if (viewSelect.value === &#x27;tropical&#x27;) {
      const rooms=tropicalRooms.map(r =&gt; ({...r, kind:&#x27;Indoor exhibit&#x27;}));
      const paths=pathsToggle.checked?tropicalPaths.map(p=&gt;({...p,kind:&#x27;Accessible indoor path&#x27;})):[];
      return rooms.concat(paths);
    }
    const hs = habitats.map(h =&gt; ({...h, kind:h.existing ? &#x27;Existing habitat&#x27; : &#x27;New habitat&#x27;}));
    const bs = siteBuildings.filter(b =&gt; serviceToggle.checked || !b.service).map(b =&gt; ({...b, kind:b.service ? &#x27;Staff building&#x27; : &#x27;Building&#x27;}));
    const pp=pathsToggle.checked?publicPaths.map(p=&gt;({...p,kind:p.existing?&#x27;Existing public path&#x27;:&#x27;Public path&#x27;})):[];
    const sp=pathsToggle.checked&amp;&amp;serviceToggle.checked?servicePaths.map(p=&gt;({...p,kind:&#x27;Staff path&#x27;})):[];
    const ws=walls.map(w=&gt;({...w,kind:&#x27;Outer wall&#x27;}));
    const gs=gates.filter(g=&gt;serviceToggle.checked||!g.service).map(g=&gt;({...g,kind:g.service?&#x27;Staff gate&#x27;:&#x27;Public gate&#x27;}));

  function repopulateFeatures() {
    const list = featureList();
    featureSelect.replaceChildren();
    const overall = document.createElement(&#x27;option&#x27;);
    overall.value = &#x27;SITE&#x27;;
    overall.textContent = viewSelect.value === &#x27;site&#x27; ? &#x27;Whole expanded zoo&#x27; : &#x27;Whole Tropical House&#x27;;
    featureSelect.appendChild(overall);
    for (const item of list) {
      const option = document.createElement(&#x27;option&#x27;);
      option.value = item.id;
      option.textContent = `${item.id} · ${item.name}`;
      featureSelect.appendChild(option);
    }
    if (!list.some(x =&gt; x.id === selectedId)) selectedId = &#x27;SITE&#x27;;
    featureSelect.value = selectedId;
  }

  function describeSelected() {
    if (selectedId === &#x27;SITE&#x27;) {
      if (viewSelect.value === &#x27;site&#x27;) {
        detail.innerHTML = &#x27;&lt;strong&gt;Whole expanded zoo&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Bounds x −58..58, z −16..70 · 9,976 m² · dashed habitats are the preserved original core.&lt;/span&gt;&#x27;;
      } else {
        detail.innerHTML = &#x27;&lt;strong&gt;Tropical House interior&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Local bounds x −13..13, z −10..10 · main door x=−13 at z −2..2 · separate indoor scene.&lt;/span&gt;&#x27;;
      }
      return;
    }
    const item = featureList().find(x =&gt; x.id === selectedId);
    if (!item) return;
    const source=item.rect?null:(item.pts||[item.line.slice(0,2),item.line.slice(2,4)]);
    const r = item.rect||[
      Math.min(...source.map(p=&gt;p[0])),Math.max(...source.map(p=&gt;p[0])),
      Math.min(...source.map(p=&gt;p[1])),Math.max(...source.map(p=&gt;p[1]))
    ];
    const size = `${(r[1]-r[0]).toFixed(1)} × ${(r[3]-r[2]).toFixed(1)} m`;
    const focus = item.focus ? ` · focus (${item.focus[0]}, ${item.focus[1]})` : &#x27;&#x27;;
    const height = item.height ? ` · height ${item.height} m` : &#x27;&#x27;;
    const note = item.note ? ` · ${item.note}` : &#x27;&#x27;;
    const width=item.width?` · width ${item.width} m`:&#x27;&#x27;;
    const geometry=source?` · centreline ${source.map(p=&gt;`(${p[0]}, ${p[1]})`).join(&#x27; → &#x27;)}`:
      ` · x ${r[0]}..${r[1]}, z ${r[2]}..${r[3]} · ${size}`;
    detail.innerHTML = `&lt;strong&gt;${item.id} · ${item.name}&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;${item.kind}${geometry}${width}${focus}${height}${note}&lt;/span&gt;`;
  }

  function draw() {
    svg.replaceChildren();
    shapeIndex = new Map();
    const isSite = viewSelect.value === &#x27;site&#x27;;
    const bounds = isSite ? siteBounds : tropicalBounds;
    const measured = Math.max(320, Math.round(svg.getBoundingClientRect().width || root.clientWidth || 736));
    const aspect = (bounds.z1 - bounds.z0) / (bounds.x1 - bounds.x0);
    const height = Math.max(420, Math.round((measured - 84) * aspect + 76));
    svg.setAttribute(&#x27;height&#x27;, height);
    svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${measured} ${height}`);
    const margin = { left:44, right:22, top:26, bottom:38 };
    const plotW = measured - margin.left - margin.right;
    const plotH = height - margin.top - margin.bottom;
    const sx = x =&gt; margin.left + (x - bounds.x0) / (bounds.x1 - bounds.x0) * plotW;
    const sy = z =&gt; margin.top + (bounds.z1 - z) / (bounds.z1 - bounds.z0) * plotH;
    const unitX = plotW / (bounds.x1 - bounds.x0);
    const unitZ = plotH / (bounds.z1 - bounds.z0);
    const rectAttrs = r =&gt; ({ x:sx(r[0]), y:sy(r[3]), width:(r[1]-r[0])*unitX, height:(r[3]-r[2])*unitZ });

    el(&#x27;rect&#x27;, { x:margin.left, y:margin.top, width:plotW, height:plotH, class:&#x27;map-frame&#x27; });
    const step = isSite ? 10 : 5;
    const xStart = Math.ceil(bounds.x0 / step) * step;
    const zStart = Math.ceil(bounds.z0 / step) * step;
    for (let x = xStart; x &lt;= bounds.x1; x += step) {
      el(&#x27;line&#x27;, { x1:sx(x), y1:margin.top, x2:sx(x), y2:margin.top+plotH, class:&#x27;grid-line&#x27; });
      const t = el(&#x27;text&#x27;, { x:sx(x), y:height-17, &#x27;text-anchor&#x27;:&#x27;middle&#x27;, class:&#x27;axis-label&#x27; });
      t.textContent = x;
    }
    for (let z = zStart; z &lt;= bounds.z1; z += step) {
      el(&#x27;line&#x27;, { x1:margin.left, y1:sy(z), x2:margin.left+plotW, y2:sy(z), class:&#x27;grid-line&#x27; });
      const t = el(&#x27;text&#x27;, { x:margin.left-8, y:sy(z)+4, &#x27;text-anchor&#x27;:&#x27;end&#x27;, class:&#x27;axis-label&#x27; });
      t.textContent = z;
    }

    if (isSite) drawSite(sx, sy, unitX, unitZ, measured);
    else drawTropical(sx, sy, unitX, unitZ, measured);

    const arrowX = margin.left + 16;
    el(&#x27;line&#x27;, { x1:arrowX, y1:margin.top+30, x2:arrowX, y2:margin.top+8, class:&#x27;north-arrow&#x27; });
    el(&#x27;path&#x27;, { d:`M${arrowX-5},${margin.top+14} L${arrowX},${margin.top+7} L${arrowX+5},${margin.top+14}`, class:&#x27;north-arrow&#x27; });
    const n = el(&#x27;text&#x27;, { x:arrowX, y:margin.top+43, &#x27;text-anchor&#x27;:&#x27;middle&#x27;, class:&#x27;north-label&#x27; });
    n.textContent = &#x27;N&#x27;;

    const scaleMetres = isSite ? 10 : 5;
    const scaleX = margin.left + plotW - scaleMetres * unitX - 8;
    const scaleY = margin.top + plotH - 12;
    el(&#x27;line&#x27;, { x1:scaleX, y1:scaleY, x2:scaleX+scaleMetres*unitX, y2:scaleY, class:&#x27;scale-bar&#x27; });
    el(&#x27;line&#x27;, { x1:scaleX, y1:scaleY-4, x2:scaleX, y2:scaleY+4, class:&#x27;scale-bar&#x27; });
    el(&#x27;line&#x27;, { x1:scaleX+scaleMetres*unitX, y1:scaleY-4, x2:scaleX+scaleMetres*unitX, y2:scaleY+4, class:&#x27;scale-bar&#x27; });
    const st = el(&#x27;text&#x27;, { x:scaleX+scaleMetres*unitX/2, y:scaleY-7, &#x27;text-anchor&#x27;:&#x27;middle&#x27;, class:&#x27;scale-label&#x27; });
    st.textContent = `${scaleMetres} m`;

    for (const [id, node] of shapeIndex) {
      if (id === selectedId) node.classList.add(&#x27;selected-shape&#x27;);
    }
    describeSelected();
  }

  function drawSite(sx, sy, unitX, unitZ, measured) {
    const narrow = measured &lt; 520;
    for (const d of districts) {
      if (d.service &amp;&amp; !serviceToggle.checked) continue;
      const r = d.rect;
      el(&#x27;rect&#x27;, { x:sx(r[0]), y:sy(r[3]), width:(r[1]-r[0])*unitX, height:(r[3]-r[2])*unitZ, class:&#x27;district-shape&#x27;, fill:`var(${d.color})` });
      if (!narrow &amp;&amp; !d.service) {
        const t = el(&#x27;text&#x27;, { x:sx((r[0]+r[1])/2), y:sy(r[3]) + 13, &#x27;text-anchor&#x27;:&#x27;middle&#x27;, class:&#x27;district-label&#x27; });
        t.textContent = d.name;
      }
    }

    if (pathsToggle.checked) {
      for (const p of publicPaths) {
        const points = p.pts.map(q =&gt; `${sx(q[0])},${sy(q[1])}`).join(&#x27; &#x27;);
        const node=el(&#x27;polyline&#x27;, { points, class:&#x27;public-path&#x27;, &#x27;stroke-width&#x27;:Math.max(2, p.width * Math.min(unitX,unitZ)), &#x27;data-tooltip&#x27;:`${p.id} · ${p.name}` });
        node.addEventListener(&#x27;click&#x27;,()=&gt;selectFeature(p.id));
        shapeIndex.set(p.id,node);
      }
      if (serviceToggle.checked) {
        for (const p of servicePaths) {
          const points = p.pts.map(q =&gt; `${sx(q[0])},${sy(q[1])}`).join(&#x27; &#x27;);
          const node=el(&#x27;polyline&#x27;, { points, class:&#x27;service-path&#x27;, &#x27;stroke-width&#x27;:Math.max(2, p.width * Math.min(unitX,unitZ)), &#x27;data-tooltip&#x27;:`${p.id} · ${p.name}` });
          node.addEventListener(&#x27;click&#x27;,()=&gt;selectFeature(p.id));
          shapeIndex.set(p.id,node);
        }
      }
    }

    for (const h of habitats) {
      const d = districts.find(x =&gt; x.id === h.district);
      const r = h.rect;
      const node = el(&#x27;rect&#x27;, {
        x:sx(r[0]), y:sy(r[3]), width:(r[1]-r[0])*unitX, height:(r[3]-r[2])*unitZ,
        class:`habitat-shape${h.existing ? &#x27; existing&#x27; : &#x27;&#x27;}`, fill:`var(${d ? d.color : districtColors.D0})`, &#x27;fill-opacity&#x27;:h.existing ? .26 : .38,
        &#x27;data-tooltip&#x27;:`${h.id} · ${h.name} · x ${r[0]}..${r[1]}, z ${r[2]}..${r[3]}`
      });
      node.addEventListener(&#x27;click&#x27;, () =&gt; selectFeature(h.id));
      shapeIndex.set(h.id, node);
      const label = el(&#x27;text&#x27;, { x:sx((r[0]+r[1])/2), y:sy((r[2]+r[3])/2)+4, &#x27;text-anchor&#x27;:&#x27;middle&#x27;, class:&#x27;shape-label&#x27; });
      label.textContent = narrow ? h.id : `${h.id} ${h.short || h.name.split(&#x27; · &#x27;)[0]}`;
      el(&#x27;circle&#x27;, { cx:sx(h.focus[0]), cy:sy(h.focus[1]), r:3.2, class:&#x27;focus-mark&#x27; });
    }

    if (buildingsToggle.checked) {
      for (const b of siteBuildings) {
        if (b.service &amp;&amp; !serviceToggle.checked) continue;
        const r = b.rect;
        const node = el(&#x27;rect&#x27;, {
          x:sx(r[0]), y:sy(r[3]), width:(r[1]-r[0])*unitX, height:(r[3]-r[2])*unitZ,
          class:`building-shape${b.service ? &#x27; service-building&#x27; : &#x27;&#x27;}`,
          &#x27;data-tooltip&#x27;:`${b.id} · ${b.name} · x ${r[0]}..${r[1]}, z ${r[2]}..${r[3]}`
        });
        node.addEventListener(&#x27;click&#x27;, () =&gt; selectFeature(b.id));
        shapeIndex.set(b.id, node);
        if ((r[1]-r[0]) * unitX &gt; 28 &amp;&amp; (r[3]-r[2]) * unitZ &gt; 18) {
          const label = el(&#x27;text&#x27;, { x:sx((r[0]+r[1])/2), y:sy((r[2]+r[3])/2)+4, &#x27;text-anchor&#x27;:&#x27;middle&#x27;, class:&#x27;shape-label&#x27; });
          label.textContent = narrow ? b.id : `${b.id} ${b.short || &#x27;&#x27;}`.trim();
        }
      }
    }

    for (const w of walls) {
      const q=w.line;
      const node=el(&#x27;line&#x27;, { x1:sx(q[0]), y1:sy(q[1]), x2:sx(q[2]), y2:sy(q[3]), class:&#x27;outer-wall&#x27;, &#x27;data-tooltip&#x27;:`${w.id} · ${w.name}` });
      node.addEventListener(&#x27;click&#x27;,()=&gt;selectFeature(w.id));
      shapeIndex.set(w.id,node);
    }
    for (const g of gates) {
      if (g.service &amp;&amp; !serviceToggle.checked) continue;
      const node=el(&#x27;line&#x27;, { x1:sx(g.line[0]), y1:sy(g.line[1]), x2:sx(g.line[2]), y2:sy(g.line[3]), class:&#x27;gate-mark&#x27;, &#x27;data-tooltip&#x27;:g.name });
      node.addEventListener(&#x27;click&#x27;,()=&gt;selectFeature(g.id));
      shapeIndex.set(g.id,node);
    }
  }

  function drawTropical(sx, sy, unitX, unitZ, measured) {
    const narrow = measured &lt; 520;
    if (pathsToggle.checked) {
      for (const p of tropicalPaths) {
        const r = p.rect;
        const node=el(&#x27;rect&#x27;, { x:sx(r[0]), y:sy(r[3]), width:(r[1]-r[0])*unitX, height:(r[3]-r[2])*unitZ, class:&#x27;public-path&#x27;, fill:&#x27;var(--muted-foreground)&#x27;, &#x27;fill-opacity&#x27;:.22, stroke:&#x27;none&#x27;, &#x27;data-tooltip&#x27;:`${p.id} · ${p.name}` });
        node.addEventListener(&#x27;click&#x27;,()=&gt;selectFeature(p.id));
        shapeIndex.set(p.id,node);
      }
    }
    for (let i = 0; i &lt; tropicalRooms.length; i++) {
      const room = tropicalRooms[i];
      const r = room.rect;
      const node = el(&#x27;rect&#x27;, {
        x:sx(r[0]), y:sy(r[3]), width:(r[1]-r[0])*unitX, height:(r[3]-r[2])*unitZ,
        class:&#x27;habitat-shape&#x27;, fill:`var(${tropicalColors[i % tropicalColors.length]})`, &#x27;fill-opacity&#x27;:.35,
        &#x27;data-tooltip&#x27;:`${room.id} · ${room.name} · x ${r[0]}..${r[1]}, z ${r[2]}..${r[3]}`
      });
      node.addEventListener(&#x27;click&#x27;, () =&gt; selectFeature(room.id));
      shapeIndex.set(room.id, node);
      const label = el(&#x27;text&#x27;, { x:sx((r[0]+r[1])/2), y:sy((r[2]+r[3])/2)+4, &#x27;text-anchor&#x27;:&#x27;middle&#x27;, class:&#x27;shape-label&#x27; });
      label.textContent = narrow ? room.id : `${room.id} ${room.name.split(&#x27; · &#x27;)[0]}`;
    }
    const shell = [[-13,-10,-13,-2],[-13,2,-13,5.2],[-13,7.2,-13,10],[13,-10,13,6],[13,8.4,13,10],[-13,-10,13,-10],[-13,10,13,10]];
    for (const w of shell) el(&#x27;line&#x27;, { x1:sx(w[0]), y1:sy(w[1]), x2:sx(w[2]), y2:sy(w[3]), class:&#x27;outer-wall&#x27; });
    const doors = [[-13,-2,-13,2],[-13,5.2,-13,7.2],[13,6,13,8.4]];
    for (const d of doors) el(&#x27;line&#x27;, { x1:sx(d[0]), y1:sy(d[1]), x2:sx(d[2]), y2:sy(d[3]), class:&#x27;gate-mark&#x27; });
  }

  function selectFeature(id) {
    selectedId = id;
    featureSelect.value = id;
    draw();
  }

  viewSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
    selectedId = &#x27;SITE&#x27;;
    repopulateFeatures();
    draw();
  });
  featureSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
    selectedId = featureSelect.value;
    draw();
  });
  for (const control of [pathsToggle, buildingsToggle, serviceToggle]) {
    control.addEventListener(&#x27;change&#x27;, () =&gt; {
      repopulateFeatures();
      draw();
    });
  }

  repopulateFeatures();
  draw();
  new ResizeObserver(draw).observe(root.querySelector(&#x27;.zoo-map-surface&#x27;));
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };

    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

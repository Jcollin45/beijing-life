name: Live game boot

on:
  push:
    branches: [main]
    paths:
      - index.html
      - ZOO-EXPANSION-BLUEPRINT.json
      - ZOO-PENS-BUILDINGS-BLUEPRINT.json
      - js/**
      - .bootcheck.js
      - live-game-boot-check.js
      - .harness-env.js
      - .render-gate.js
      - serve.py
      - .github/workflows/live-game-boot.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-game-boot-main
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Start the no-cache game server
        run: |
          python3 serve.py 8000 > /tmp/beijing-life-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/beijing-life-server.log
          exit 1

      - name: Boot, enter, and draw the game
        env:
          CHROME: /usr/bin/google-chrome
          GAME_TEST_SOFTWARE_WEBGL: "1"
          BOOT_DEVTOOLS_TRIES: "600"
          BOOTCHECK_TIMEOUT_MS: "180000"
          HARNESS_TIMEOUT_MS: "600000"
          LIVE_SCREENSHOT_DIR: test-results/zoo-visuals
        shell: bash
        run: |
          set +e
          node live-game-boot-check.js 2>&1 | tee /tmp/live-game-boot.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            {
              echo '### Live game boot failure'
              echo '```text'
              tail -80 /tmp/live-game-boot.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message="$(tail -30 /tmp/live-game-boot.log | tr '\n' ' ' | cut -c1-3500)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Remote game boot failed::$message"
          fi
          exit "$status"

      - name: Upload zoo visual-review captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zoo-visual-review-${{ github.sha }}
          path: test-results/zoo-visuals/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish GitHub visual-review branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set +e
          (
            set -e
            shopt -s nullglob
            captures=(test-results/zoo-visuals/*.png)
            if (( ${#captures[@]} == 0 )); then
              echo 'No captures were produced; visual-review branch was not changed.'
              exit 0
            fi
            review_dir="$(mktemp -d)"
            mkdir -p "$review_dir/captures"
            cp "${captures[@]}" "$review_dir/captures/"
            printf '%s\n' \
              '# Zoo visual review' \
              '' \
              "GitHub-hosted Chrome captures for source commit \`$SOURCE_SHA\`." \
              '' \
              "[Workflow run]($SOURCE_RUN)" \
              '' \
              'These files are replaced on every qualifying main-branch run.' \
              > "$review_dir/README.md"
            git -C "$review_dir" init -b zoo-visual-review
            git -C "$review_dir" config user.name 'github-actions[bot]'
            git -C "$review_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$review_dir" add README.md captures
            git -C "$review_dir" commit -m "Visual review for $SOURCE_SHA"
            git -C "$review_dir" remote add origin \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git -C "$review_dir" push --force origin HEAD:zoo-visual-review
          ) 2>&1 | tee /tmp/zoo-review-publish.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            message="$(tail -30 /tmp/zoo-review-publish.log | tr '\n' ' ' | cut -c1-3500)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=GitHub visual review publish failed::$message"
          fi
          exit "$status"

      - name: Print server failures
        if: failure()
        run: tail -200 /tmp/beijing-life-server.log || true

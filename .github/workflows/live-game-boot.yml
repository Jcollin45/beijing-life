name: Live game boot

on:
  push:
    branches: [main]
    paths:
      - index.html
      - ZOO-EXPANSION-BLUEPRINT.json
      - js/**
      - .bootcheck.js
      - .harness-env.js
      - .render-gate.js
      - serve.py
      - .github/workflows/live-game-boot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-game-boot-main
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Start the no-cache game server
        run: |
          python3 serve.py 8000 > /tmp/beijing-life-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/beijing-life-server.log
          exit 1

      - name: Boot, enter, and draw the game
        env:
          CHROME: /usr/bin/google-chrome
          GAME_TEST_SOFTWARE_WEBGL: "1"
          BOOT_DEVTOOLS_TRIES: "600"
          BOOTCHECK_TIMEOUT_MS: "180000"
          HARNESS_TIMEOUT_MS: "600000"
        shell: bash
        run: |
          set +e
          node .bootcheck.js 2>&1 | tee /tmp/live-game-boot.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            {
              echo '### Live game boot failure'
              echo '```text'
              tail -80 /tmp/live-game-boot.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message="$(tail -30 /tmp/live-game-boot.log | tr '\n' ' ' | cut -c1-3500)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Remote game boot failed::$message"
          fi
          exit "$status"

      - name: Print server failures
        if: failure()
        run: tail -200 /tmp/beijing-life-server.log || true
